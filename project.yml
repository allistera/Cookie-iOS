name: Cookie
options:
  bundleIdPrefix: com.cookie
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
packages:
  Auth0:
    url: https://github.com/auth0/Auth0.swift
    from: 3.1.0
targets:
  Cookie:
    type: application
    platform: iOS
    sources:
      - path: Cookie/Sources
      - path: Cookie/Resources
        buildPhase: resources
    dependencies:
      - package: Auth0
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cookie.ios
        PRODUCT_NAME: Cookie
        # Allister Antosik
        DEVELOPMENT_TEAM: 88SL72L38P
        INFOPLIST_KEY_CFBundleDisplayName: Cookie
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    info:
      path: Cookie/Sources/Info.plist
      properties:
        # Read the build settings so fastlane's CURRENT_PROJECT_VERSION override
        # reaches the archive; XcodeGen otherwise hardcodes 1 / 1.0 here.
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - $(PRODUCT_BUNDLE_IDENTIFIER)
  CookieTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CookieTests
    dependencies:
      - target: Cookie
schemes:
  Cookie:
    build:
      targets:
        Cookie: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CookieTests
    archive:
      config: Release
