# SwiftLint configuration for Cookie iOS. Run locally with `swiftlint lint`.
included:
  - Cookie/Sources
  - CookieTests

excluded:
  - Cookie.xcodeproj
  - DerivedData
  - build
  - .build
  - fastlane

disabled_rules:
  # The codebase uses trailing commas in multi-line collection literals.
  - trailing_comma

opt_in_rules:
  - empty_count
  - closure_spacing
  - contains_over_first_not_nil
  - first_where
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument

line_length:
  warning: 160
  error: 200
  ignores_comments: true
  ignores_urls: true
  ignores_function_declarations: true

identifier_name:
  min_length: 2
  excluded:
    - id
    - x
    - y
    - i
    - to

type_body_length:
  warning: 300
  error: 500

file_length:
  warning: 500
  error: 1000

function_body_length:
  warning: 80
  error: 150

cyclomatic_complexity:
  warning: 15
  error: 25

nesting:
  type_level: 3

reporter: "xcode"
